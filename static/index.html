<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewBot</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--green:#b8f57a;--amber:#f5c842;--bg:#0a0a0a;--surface:#131313;--border:#222;--text:#f0ede8;--muted:#555}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:40px 24px}
.header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:40px;border-bottom:1px solid var(--border);padding-bottom:24px;flex-wrap:wrap;gap:16px}
.logo{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;letter-spacing:-1px;color:var(--green)}
.logo span{color:var(--text)}
.tagline{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.api-bar{display:flex;align-items:center;gap:10px;padding:14px 18px;background:var(--surface);border:1px solid var(--border);margin-bottom:28px;flex-wrap:wrap}
.api-bar.ok{border-color:#2a4a10;background:#0d1a07}
.api-bar label{font-size:12px;color:var(--muted);white-space:nowrap;letter-spacing:1px}
.api-bar input{flex:1;min-width:180px;font-size:12px;padding:8px 12px;border:1px solid #333;background:#0a0a0a;color:var(--text);outline:none;font-family:'DM Mono',monospace}
.api-bar input:focus{border-color:var(--green)}
.api-ok{font-size:11px;color:var(--green);display:none;letter-spacing:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-bottom:28px}
.stat{background:var(--surface);padding:18px 20px}
.stat-n{font-family:'Syne',sans-serif;font-size:30px;font-weight:800;color:var(--green);line-height:1}
.stat-l{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:4px}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{font-size:12px;padding:8px 16px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;transition:all 0.15s;letter-spacing:0.5px}
.tab:hover{border-color:var(--green);color:var(--green)}
.tab.active{background:var(--green);color:#0a0a0a;border-color:var(--green);font-weight:600}
.section-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-label{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase}
.btn-auto{font-size:11px;padding:7px 14px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;transition:all 0.15s}
.btn-auto:hover{border-color:var(--green);color:var(--green)}
.reviews{display:flex;flex-direction:column;gap:1px;background:var(--border);border:1px solid var(--border)}
.rcard{background:var(--surface);padding:18px 20px;transition:background 0.15s}
.rcard:hover{background:#161616}
.rmeta{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;flex-wrap:wrap;gap:6px}
.rauthor{font-family:'Syne',sans-serif;font-size:14px;font-weight:700}
.rmeta-right{display:flex;align-items:center;gap:8px}
.rdate{font-size:11px;color:var(--muted)}
.badge{font-size:10px;padding:2px 8px;border:1px solid;letter-spacing:1px;text-transform:uppercase}
.badge-new{border-color:#333;color:#555}
.badge-responded{border-color:#2a4a10;color:var(--green)}
.stars{font-size:13px;margin-bottom:8px}
.rtext{font-size:13px;color:#999;line-height:1.7;margin-bottom:12px}
.ractions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn-gen{font-size:11px;padding:7px 14px;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;transition:all 0.15s}
.btn-gen:hover{border-color:var(--green);color:var(--green)}
.btn-gen:disabled{opacity:0.35;cursor:not-allowed}
.btn-post{font-size:11px;padding:7px 14px;border:1px solid var(--green);background:transparent;color:var(--green);cursor:pointer;font-family:'DM Mono',monospace;letter-spacing:1px;text-transform:uppercase;transition:all 0.15s}
.btn-post:hover{background:var(--green);color:#0a0a0a}
.reply-box{margin-top:12px;border:1px solid #1a2e0a;background:#0d1a07}
.reply-label{font-size:10px;color:var(--green);padding:6px 12px;border-bottom:1px solid #1a2e0a;display:flex;justify-content:space-between;letter-spacing:1px;text-transform:uppercase}
.reply-ta{width:100%;background:transparent;border:none;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;padding:12px;resize:vertical;min-height:80px;outline:none;line-height:1.7}
.already{font-size:11px;color:var(--green);letter-spacing:1px}
.dots{display:inline-flex;gap:4px;align-items:center}
.dot{width:5px;height:5px;background:currentColor;border-radius:50%;animation:dp 1.2s infinite}
.dot:nth-child(2){animation-delay:0.2s}
.dot:nth-child(3){animation-delay:0.4s}
@keyframes dp{0%,100%{opacity:0.2;transform:scale(0.8)}50%{opacity:1;transform:scale(1.2)}}
.toast{position:fixed;bottom:24px;right:24px;background:var(--green);color:#0a0a0a;font-family:'DM Mono',monospace;font-size:12px;font-weight:600;padding:10px 18px;letter-spacing:1px;display:none;z-index:99}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="logo">REVIEW<span>BOT</span></div>
      <div class="tagline">AI-powered Google review management</div>
    </div>
    <button class="btn-auto" onclick="autoAll()">Auto-respond all</button>
  </div>

  <div class="api-bar" id="apiBar">
    <label>API KEY</label>
    <input type="password" id="apiKey" placeholder="sk-ant-api03-..." oninput="onKey()">
    <span class="api-ok" id="apiOk">✓ CONNECTED</span>
  </div>

  <div class="stats">
    <div class="stat"><div class="stat-n" id="sNew">0</div><div class="stat-l">Awaiting reply</div></div>
    <div class="stat"><div class="stat-n" id="sDone">0</div><div class="stat-l">Responded</div></div>
    <div class="stat"><div class="stat-n" id="sAll">0</div><div class="stat-l">Total reviews</div></div>
  </div>

  <div class="tabs" id="tabs"></div>

  <div class="section-row">
    <span class="section-label" id="bizLabel">Reviews</span>
  </div>

  <div class="reviews" id="grid"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const BIZ=[
  {id:1,name:"Oakwood Plumbing",type:"plumbing contractor",tone:"professional and reassuring"},
  {id:2,name:"The Fig & Vine",type:"restaurant and wine bar",tone:"warm, hospitable and genuine"},
  {id:3,name:"Bloom Hair Studio",type:"hair salon",tone:"friendly and personal"},
];
const DATA={
  1:[
    {id:1,author:"Sarah M.",stars:5,date:"2 days ago",text:"Brilliant service. Fixed our burst pipe at 11pm on a Sunday — no fuss, fair price. Will definitely use again.",status:"new"},
    {id:2,author:"James P.",stars:2,date:"5 days ago",text:"Booked for 9am, didn't show until noon with no call. Work was fine once done but the communication was really poor.",status:"new"},
    {id:3,author:"Helen R.",stars:5,date:"1 week ago",text:"Third time using Oakwood. Always reliable, always tidy. Dave is a legend.",status:"responded"},
  ],
  2:[
    {id:4,author:"Marco T.",stars:4,date:"1 day ago",text:"Great atmosphere and the wine list is impressive. Food was lovely, service a little slow on a busy Friday but overall a solid evening.",status:"new"},
    {id:5,author:"Priya K.",stars:1,date:"3 days ago",text:"Found a hair in my risotto. When I told the waiter he just shrugged. Really disappointing for the price point.",status:"new"},
  ],
  3:[
    {id:6,author:"Charlotte B.",stars:5,date:"Today",text:"Amy is an absolute artist. I showed her a vague Pinterest board and she completely understood the vision. Best hair I've ever had!",status:"new"},
  ],
};
let sel=1,replies={},loading=new Set();
function getKey(){return document.getElementById('apiKey').value.trim()||localStorage.getItem('rb_key')||'';}
function onKey(){
  const k=getKey(),ok=document.getElementById('apiOk'),bar=document.getElementById('apiBar');
  if(k.startsWith('sk-ant')){ok.style.display='block';bar.classList.add('ok');localStorage.setItem('rb_key',k);}
  else{ok.style.display='none';bar.classList.remove('ok');}
}
function stars(n){return[1,2,3,4,5].map(i=>`<span style="color:${i<=n?'#f5c842':'#333'}">★</span>`).join('');}
function renderTabs(){document.getElementById('tabs').innerHTML=BIZ.map(b=>`<button class="tab ${b.id===sel?'active':''}" onclick="pick(${b.id})">${b.name}</button>`).join('');}
function pick(id){sel=id;renderTabs();renderGrid();}
function updateStats(){const all=Object.values(DATA).flat();document.getElementById('sNew').textContent=all.filter(r=>r.status==='new').length;document.getElementById('sDone').textContent=all.filter(r=>r.status==='responded').length;document.getElementById('sAll').textContent=all.length;}
function renderGrid(){
  const biz=BIZ.find(b=>b.id===sel);
  document.getElementById('bizLabel').textContent=biz.name+' — reviews';
  document.getElementById('grid').innerHTML=(DATA[sel]||[]).map(r=>{
    const isLoad=loading.has(r.id),reply=replies[r.id];
    const actions=r.status==='responded'&&!reply
      ?`<span class="already">✓ Already responded</span>`
      :`<button class="btn-gen" onclick="gen(${r.id})" ${isLoad?'disabled':''}>${isLoad?'<span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>':'Generate AI reply'}</button>${reply?`<button class="btn-post" onclick="post(${r.id})">Post response</button>`:''}`;
    const replyBox=reply?`<div class="reply-box"><div class="reply-label"><span>AI generated reply</span><span style="opacity:0.6">${biz.tone}</span></div><textarea class="reply-ta" oninput="replies[${r.id}]=this.value">${reply}</textarea></div>`:'';
    return`<div class="rcard"><div class="rmeta"><span class="rauthor">${r.author}</span><div class="rmeta-right"><span class="rdate">${r.date}</span><span class="badge badge-${r.status}">${r.status}</span></div></div><div class="stars">${stars(r.stars)}</div><div class="rtext">${r.text}</div><div class="ractions">${actions}</div>${replyBox}</div>`;
  }).join('');
}
async function gen(id){
  const key=getKey();
  if(!key){toast('Add your API key first');return;}
  const biz=BIZ.find(b=>b.id===sel),rev=DATA[sel].find(r=>r.id===id);
  loading.add(id);renderGrid();
  try{
    const res=await fetch('/api/generate',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        apiKey:key,
        prompt:`You manage Google reviews for "${biz.name}", a ${biz.type}. Write a ${biz.tone} reply to this ${rev.stars}-star review from ${rev.author}. Review: "${rev.text}". Under 80 words. Sound human, address their specifics. No hashtags or emojis.`
      })
    });
    const d=await res.json();
    if(d.error)throw new Error(JSON.stringify(d.error));
    replies[id]=d.content?.find(b=>b.type==='text')?.text||'No response received';
    toast('Reply generated');
  }catch(e){replies[id]='Error: '+e.message;}
  loading.delete(id);renderGrid();
}
function post(id){DATA[sel].find(r=>r.id===id).status='responded';toast('Response posted');updateStats();renderGrid();}
async function autoAll(){const p=DATA[sel].filter(r=>r.status==='new');if(!p.length){toast('No pending reviews');return;}for(const r of p)await gen(r.id);}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>{t.style.display='none';},3000);}
window.onload=()=>{const s=localStorage.getItem('rb_key');if(s){document.getElementById('apiKey').value=s;onKey();}renderTabs();renderGrid();updateStats();};
</script>
</body>
</html>
